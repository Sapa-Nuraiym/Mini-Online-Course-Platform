{% extends "base.html" %}
{% block content %}
<h1>Курстар тізімі</h1>

<form id="search-form" style="margin-bottom:20px">
    <input type="text" id="search" placeholder="Курс іздеу...">
    <button type="submit">Іздеу</button>
</form>

<div id="courses-list"></div>

<h2>Жаңа курс қосу</h2>
<form id="course-form">
    <div class="form-group">
        <label>Атауы:</label>
        <input type="text" id="title" required>
    </div>
    <div class="form-group">
        <label>Сипаттама:</label>
        <textarea id="description"></textarea>
    </div>
    <div class="form-group">
        <label>Санат:</label>
        <input type="text" id="category">
    </div>
    <button type="submit">Қосу</button>
</form>
<div id="message"></div>

<script>
async function loadCourses(search = '') {
    const url = search ? `/api/courses?search=${search}` : '/api/courses';
    const res = await fetch(url);
    const courses = await res.json();
    const list = document.getElementById('courses-list');
    if (courses.length === 0) {
        list.innerHTML = '<p>Курстар жоқ</p>';
        return;
    }
    list.innerHTML = courses.map(c => `
        <div class="course-card">
            <h3>${c.title}</h3>
            <p>${c.description || ''}</p>
            <p><b>Санат:</b> ${c.category || '-'}</p>
            <button onclick="deleteCourse(${c.id})">Өшіру</button>
        </div>
    `).join('');
}

async function deleteCourse(id) {
    await fetch(`/api/courses/${id}`, { method: 'DELETE' });
    loadCourses();
}

document.getElementById('search-form').onsubmit = (e) => {
    e.preventDefault();
    loadCourses(document.getElementById('search').value);
};

document.getElementById('course-form').onsubmit = async (e) => {
    e.preventDefault();
    const res = await fetch('/api/courses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            category: document.getElementById('category').value,
            user_id: 1
        })
    });
    const data = await res.json();
    document.getElementById('message').innerHTML =
        res.ok ? '<p class="success">Курс қосылды!</p>' : '<p class="error">Қате!</p>';
    if (res.ok) loadCourses();
};

loadCourses();
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Тіркелу{% endblock %}
{% block content %}
<div class="container">
    <div class="card" style="max-width:480px; margin: 50px auto;">
        <h1>📝 Тіркелу</h1>
        <div id="message"></div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="username">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="example@mail.com">
        </div>
        <div class="form-group">
            <label>Құпия сөз</label>
            <input type="password" id="password" placeholder="кемінде 6 символ">
        </div>
        <div class="form-group">
            <label>Роль</label>
            <select id="role">
                <option value="student">Студент</option>
                <option value="teacher">Мұғалім</option>
            </select>
        </div>
        <button type="button" id="regBtn">Тіркелу →</button>
        <div class="link-text">Аккаунт бар ма? <a href="/login">Кіру</a></div>
    </div>
</div>
<script>
document.getElementById('regBtn').addEventListener('click', async function() {
    const msg = document.getElementById('message');
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;

    if (!username || !email || !password) {
        msg.innerHTML = '<div class="error">❌ Барлық өрістерді толтырыңыз!</div>';
        return;
    }

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email, password, role})
        });
        const data = await res.json();
        if (res.ok) {
            msg.innerHTML = '<div class="success">✅ Тіркелу сәтті өтті! Кіруге өтіңіз.</div>';
            setTimeout(() => window.location.href = '/login', 1500);
        } else {
            msg.innerHTML = '<div class="error">❌ ' + (data.error || (data.errors && data.errors.join(', ')) || 'Қате') + '</div>';
        }
    } catch(e) {
        msg.innerHTML = '<div class="error">❌ Сервермен байланыс жоқ. Сервер іске қосылған ба?</div>';
    }
});
</script>
{% endblock %}

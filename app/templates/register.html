{% extends "base.html" %}
{% block content %}
<h1>Тіркелу</h1>
<form id="register-form">
    <div class="form-group">
        <label>Пайдаланушы аты:</label>
        <input type="text" id="username" required>
    </div>
    <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" required>
    </div>
    <div class="form-group">
        <label>Құпия сөз:</label>
        <input type="password" id="password" required>
    </div>
    <div class="form-group">
        <label>Рол:</label>
        <select id="role">
            <option value="student">Студент</option>
            <option value="teacher">Мұғалім</option>
        </select>
    </div>
    <button type="submit">Тіркелу</button>
</form>
<div id="message"></div>

<script>
document.getElementById('register-form').onsubmit = async (e) => {
    e.preventDefault();
    const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value
        })
    });
    const data = await res.json();
    document.getElementById('message').innerHTML = res.ok
        ? '<p class="success">Тіркелу сәтті! <a href="/login-page">Кіру</a></p>'
        : `<p class="error">${JSON.stringify(data.errors || data.error)}</p>`;
};
</script>
{% endblock %}

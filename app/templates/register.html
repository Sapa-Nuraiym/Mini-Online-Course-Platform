{% extends "base.html" %}
{% block title %}Тіркелу{% endblock %}
{% block content %}
<div class="container">
    <div class="card">
        <h1>📝 Тіркелу</h1>
        <div id="message"></div>
        <form id="registerForm">
            <label>Username</label>
            <input type="text" id="username" placeholder="username жаз" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="email@example.com" required>

            <label>Құпия сөз</label>
            <input type="password" id="password" placeholder="кемінде 6 символ" required>

            <label>Роль</label>
            <select id="role">
                <option value="student">Студент</option>
                <option value="teacher">Мұғалім</option>
            </select>

            <button type="submit">Тіркелу</button>
        </form>
        <div class="link"><a href="/login">Аккаунт бар ма? Кіру</a></div>
    </div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('message');
    msg.innerHTML = '';

    const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value
        })
    });
    const data = await res.json();
    if (res.ok) {
        msg.innerHTML = '<div class="success">✅ Тіркелу сәтті! <a href="/login">Кіру</a></div>';
    } else {
        msg.innerHTML = '<div class="error">❌ ' + (data.error || data.errors?.join(', ')) + '</div>';
    }
});
</script>
{% endblock %}

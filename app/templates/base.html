<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mini Course Platform{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        button { background: #4CAF50; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #45a049; }
        .error { color: red; margin: 10px 0; padding: 10px; background: #ffe0e0; border-radius: 4px; }
        .success { color: green; margin: 10px 0; padding: 10px; background: #e0ffe0; border-radius: 4px; }
        nav { background: #333; padding: 15px 20px; margin-bottom: 30px; }
        nav a { color: white; text-decoration: none; margin-right: 20px; font-size: 16px; }
        nav a:hover { color: #4CAF50; }
        label { font-weight: bold; color: #555; }
        .link { text-align: center; margin-top: 15px; }
        .link a { color: #4CAF50; }
    </style>
</head>
<body>
    <nav>
        <a href="/">🏠 Басты бет</a>
        <a href="/register">Тіркелу</a>
        <a href="/login">Кіру</a>
        <a href="/courses">Курстар</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>

{% extends "base.html" %}
{% block title %}Кіру{% endblock %}
{% block content %}
<div class="container">
    <div class="card" style="max-width:480px; margin: 50px auto;">
        <h1>🔐 Кіру</h1>
        <div id="message"></div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="example@mail.com">
        </div>
        <div class="form-group">
            <label>Құпия сөз</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button type="button" id="loginBtn">Кіру →</button>
        <div class="link-text">Аккаунт жоқ па? <a href="/register">Тіркелу</a></div>
    </div>
</div>
<script>
document.getElementById('loginBtn').addEventListener('click', async function() {
    const msg = document.getElementById('message');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (!email || !password) {
        msg.innerHTML = '<div class="error">❌ Email және құпия сөзді енгізіңіз!</div>';
        return;
    }

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (res.ok) {
            msg.innerHTML = '<div class="success">✅ Қош келдіңіз, ' + data.user.username + '!</div>';
            setTimeout(() => window.location.href = '/profile', 1000);
        } else {
            msg.innerHTML = '<div class="error">❌ ' + (data.error || 'Қате') + '</div>';
        }
    } catch(e) {
        msg.innerHTML = '<div class="error">❌ Сервермен байланыс жоқ. Сервер іске қосылған ба?</div>';
    }
});
</script>
{% endblock %}

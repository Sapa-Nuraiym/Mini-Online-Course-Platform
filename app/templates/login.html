{% extends "base.html" %}
{% block title %}Кіру{% endblock %}
{% block content %}
<div class="container">
    <div class="card">
        <h1>🔐 Кіру</h1>
        <div id="message"></div>
        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" placeholder="email@example.com" required>

            <label>Құпия сөз</label>
            <input type="password" id="password" placeholder="құпия сөз" required>

            <button type="submit">Кіру</button>
        </form>
        <div class="link"><a href="/register">Аккаунт жоқ па? Тіркелу</a></div>
    </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('message');

    const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        })
    });
    const data = await res.json();
    if (res.ok) {
        msg.innerHTML = '<div class="success">✅ Кіру сәтті! Курстарға өтіңіз.</div>';
        setTimeout(() => window.location.href = '/courses', 1000);
    } else {
        msg.innerHTML = '<div class="error">❌ ' + (data.error || 'Қате') + '</div>';
    }
});
</script>
{% endblock %}
